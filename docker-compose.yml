version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # Porta para comunicação AMQP
      - "15672:15672"  # Porta da interface de gerenciamento web
    environment:
      RABBITMQ_DEFAULT_USER: root
      RABBITMQ_DEFAULT_PASS: root
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  workers:
    build:
      context: .
    depends_on: 
      - rabbitmq
    environment:
      - RABBITMQ_URL=amqp://root:root@rabbitmq:5672
    deploy:
      replicas: 3
    restart: always
volumes:
  rabbitmq_data:
